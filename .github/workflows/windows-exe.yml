name: windows-exe

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet publish -c Release -o publish
        working-directory: windows
      - shell: pwsh
        run: |
          $tag = (git describe --tags --abbrev=0 --match "v*").TrimStart("v")
          $v = (Get-Item windows/publish/VPNToggle.exe).VersionInfo.FileVersion
          Write-Output "tag $tag, exe $v"
          if (-not $v.StartsWith("$tag.")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: VPNToggle-windows
          path: windows/publish/VPNToggle.exe
